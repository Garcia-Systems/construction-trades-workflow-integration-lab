[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trades-lab"
version = "0.1.0"
description = "Executable laboratory for testing a fictional workflow-integration hypothesis"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

